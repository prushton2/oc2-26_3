name: Release

on:
  push:
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew assemble -PmodVersion="$VERSION"

      - name: Collect release jars
        run: |
          mkdir -p dist
          find fabric/build/libs neoforge/build/libs -name '*.jar' \
            ! -name '*-dev*' ! -name '*-sources*' -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls dist)"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/*.jar \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
